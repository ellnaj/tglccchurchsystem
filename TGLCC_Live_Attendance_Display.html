<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGLCC Live Attendance Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy-deep:#0a0e27;
    --navy:#121a3f;
    --royal:#1e2a6e;
    --purple:#3a2570;
    --gold:#e6c260;
    --gold-soft:#f3dfa0;
    --gold-dim:#a3833f;
    --white:#f7f5ef;
    --ink-soft:#b9c0e0;
    --ink-faint:#8890b8;
    --card-bg:rgba(255,255,255,0.06);
    --card-border:rgba(230,194,96,0.22);
    --font-display:'Poppins', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;color:var(--white);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(58,37,112,0.55) 0%, rgba(58,37,112,0) 60%),
      radial-gradient(1000px 650px at 105% 10%, rgba(30,42,110,0.6) 0%, rgba(30,42,110,0) 55%),
      radial-gradient(900px 600px at 50% 115%, rgba(230,194,96,0.10) 0%, rgba(230,194,96,0) 60%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 45%, #0d1230 100%);
    background-attachment:fixed;
    overflow:hidden;height:100vh;width:100vw;
    position:relative;
  }
  img{max-width:100%;display:block;}

  /* ---- ambient floating particles ---- */
  .particle-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .particle{
    position:absolute;border-radius:50%;background:radial-gradient(circle, rgba(230,194,96,0.55) 0%, rgba(230,194,96,0) 70%);
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:0.8;}
    90%{opacity:0.5;}
    100%{transform:translateY(-110vh) translateX(30px);opacity:0;}
  }
  .light-ray{
    position:fixed;top:-10%;width:2px;height:120vh;
    background:linear-gradient(180deg, rgba(230,194,96,0.18) 0%, rgba(230,194,96,0) 80%);
    filter:blur(2px);pointer-events:none;z-index:0;transform:rotate(8deg);
  }

  .stage{position:relative;z-index:1;height:100vh;width:100vw;display:flex;flex-direction:column;padding:22px 40px 16px;}
  .stage.service-ended{padding-top:0;}
  .stage.service-ended .top-bar{display:none;}

  /* ---- TOP BAR: title (centered) + QR badge (corner, doesn't touch cards) ---- */
  .top-bar{position:relative;flex-shrink:0;margin-bottom:10px;padding-top:4px;min-height:86px;}

  .whos-here{text-align:center;}
  .whos-here h2{
    font-family:var(--font-display);font-size:27px;font-weight:700;margin:0 0 6px;
    color:var(--white);letter-spacing:0.01em;
  }
  .whos-here h2 .accent{color:var(--gold);}
  .churchin-count{
    display:inline-flex;align-items:baseline;gap:8px;
    padding:6px 22px;border-radius:24px;
    background:linear-gradient(90deg, rgba(230,194,96,0.14), rgba(230,194,96,0.05));
    border:1px solid rgba(230,194,96,0.35);
  }
  .churchin-count .num{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--gold-soft);}
  .churchin-count .label{font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);}

  /* ---- QR CODE BADGE (upper right, own reserved space so it never
     overlaps the member photo grid below it) ---- */
  .qr-badge{
    position:absolute;top:0;right:0;
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,0.05);border:1px solid rgba(230,194,96,0.3);
    border-radius:16px;padding:9px 16px 9px 9px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 6px 18px rgba(0,0,0,0.28);
  }
  .qr-badge img{
    width:60px;height:60px;border-radius:8px;background:#fff;padding:4px;flex-shrink:0;
  }
  .qr-badge-text{text-align:left;}
  .qr-badge-title{
    font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--gold-soft);margin:0 0 3px;
  }
  .qr-badge-sub{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.35;max-width:150px;}
  .qr-badge{animation:qrPulse 3.2s ease-in-out infinite;}
  @keyframes qrPulse{
    0%,100%{box-shadow:0 6px 18px rgba(0,0,0,0.28);border-color:rgba(230,194,96,0.3);}
    50%{box-shadow:0 6px 22px rgba(230,194,96,0.3);border-color:rgba(230,194,96,0.55);}
  }

  /* ---- WELCOME / DATE / ADMIN TIMER BADGE (upper left, mirrors the
     QR badge on the right — its own reserved space, never touches cards) ---- */
  .welcome-badge{
    position:absolute;top:0;left:0;text-align:left;
    background:rgba(255,255,255,0.05);border:1px solid rgba(230,194,96,0.22);
    border-radius:16px;padding:9px 18px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 6px 18px rgba(0,0,0,0.24);
  }
  .welcome-text{
    font-family:var(--font-display);font-style:italic;font-weight:600;font-size:16px;
    color:var(--gold-soft);margin:0 0 2px;
  }
  .welcome-date{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin:0;}
  .welcome-timer{
    font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin:5px 0 0;
    padding-top:5px;border-top:1px solid rgba(230,194,96,0.15);
  }
  .welcome-timer .count{color:var(--gold-soft);font-weight:700;}

  /* ---- GRID AREA ---- */
  .grid-area{flex:1;position:relative;min-height:0;}
  .grid-page{
    position:absolute;inset:0;display:grid;gap:18px;align-content:center;justify-content:center;
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .grid-page.leaving{opacity:0;transform:translateX(-24px);pointer-events:none;}
  .grid-page.entering{opacity:0;transform:translateX(24px);}

  /* ---- MEMBER CARD ---- */
  /* Base size is overridden per-render by JS via the --card-w / --photo-w
     custom properties, computed so every attendee fits on screen at once. */
  .member-card{
    width:var(--card-w, 110px);
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:10px 8px 8px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
    position:relative;
    animation:cardBounceIn 0.85s cubic-bezier(0.34,1.56,0.64,1) both;
    transition:transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .member-card:hover{transform:translateY(-4px);border-color:rgba(230,194,96,0.5);box-shadow:0 14px 32px rgba(0,0,0,0.35);}
  /* Elastic drop-and-bounce entrance, like the card falls into place */
  @keyframes cardBounceIn{
    0%{opacity:0;transform:translateY(-46px) scale(0.7);}
    45%{opacity:1;transform:translateY(0) scale(1.07);}
    62%{transform:translateY(-16px) scale(0.96);}
    78%{transform:translateY(0) scale(1.03);}
    90%{transform:translateY(-6px) scale(0.99);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  .member-card.just-arrived{
    animation:cardBounceIn 0.85s cubic-bezier(0.34,1.56,0.64,1) both, glowPulse 2.4s ease-in-out 0.85s 2;
    border-color:var(--gold);
  }
  @keyframes glowPulse{
    0%,100%{box-shadow:0 8px 24px rgba(0,0,0,0.25);}
    50%{box-shadow:0 8px 34px rgba(230,194,96,0.55), 0 0 0 1px rgba(230,194,96,0.4);}
  }
  .arrived-badge{
    position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    background:linear-gradient(90deg, var(--gold-dim), var(--gold));
    color:var(--navy-deep);font-family:var(--font-mono);font-size:9.5px;font-weight:700;
    letter-spacing:0.06em;text-transform:uppercase;padding:3px 10px;border-radius:12px;
    box-shadow:0 2px 10px rgba(230,194,96,0.5);white-space:nowrap;
    animation:badgeFade 3.5s ease forwards;
  }
  @keyframes badgeFade{0%,70%{opacity:1;}100%{opacity:0;}}

  .card-photo-wrap{
    width:var(--photo-w, 60px);height:var(--photo-w, 60px);border-radius:14px;overflow:hidden;margin-bottom:7px;flex-shrink:0;
    border:2px solid rgba(230,194,96,0.4);box-shadow:0 4px 14px rgba(0,0,0,0.3);
    background:linear-gradient(135deg, var(--royal), var(--purple));
  }
  .card-photo-wrap img{width:100%;height:100%;object-fit:cover;}
  .card-avatar-fallback{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:var(--photo-font, 20px);color:var(--gold-soft);
  }
  .card-name{font-family:var(--font-body);font-weight:700;font-size:var(--name-font, 12px);color:var(--white);line-height:1.2;margin-bottom:2px;word-break:break-word;}
  .card-id{font-family:var(--font-mono);font-size:var(--id-font, 9.5px);color:var(--ink-faint);letter-spacing:0.02em;}

  /* ---- pagination indicator ---- */
  .page-indicator{
    flex-shrink:0;text-align:center;margin-top:10px;
    font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);letter-spacing:0.05em;
  }
  .page-dots{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle;}
  .page-dot{width:6px;height:6px;border-radius:50%;background:rgba(230,194,96,0.25);transition:background 0.3s ease;}
  .page-dot.active{background:var(--gold);}

  /* ---- EMPTY STATE ---- */
  .empty-state{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;
    height:100%;width:100%;margin-top:-48px;
  }
  .empty-icon{
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle, rgba(230,194,96,0.16) 0%, rgba(230,194,96,0) 72%);
    display:flex;align-items:center;justify-content:center;
    animation:emptyPulse 3s ease-in-out infinite;
  }
  .empty-icon img{
    width:104px;height:104px;border-radius:50%;object-fit:cover;
    border:2px solid rgba(230,194,96,0.4);box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  @keyframes emptyPulse{0%,100%{transform:scale(1);opacity:0.85;}50%{transform:scale(1.06);opacity:1;}}
  .empty-title{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--gold-soft);margin:0;}
  .empty-sub{font-size:16px;color:var(--ink-soft);margin:0;}

  /* ---- SERVICE ENDED STATE (shown when the admin ends the session) ---- */
  .ended-state{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;
    height:100%;width:100%;
  }
  .ended-icon{
    width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle, rgba(230,194,96,0.18) 0%, rgba(230,194,96,0) 72%);
    display:flex;align-items:center;justify-content:center;
    animation:emptyPulse 3.4s ease-in-out infinite;
  }
  .ended-icon img{
    width:130px;height:130px;border-radius:50%;object-fit:cover;
    border:2px solid rgba(230,194,96,0.4);box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .ended-title{font-family:var(--font-display);font-size:44px;font-weight:700;color:var(--gold-soft);margin:0;letter-spacing:0.01em;}
  .ended-sub{font-size:21px;color:var(--ink-soft);margin:0;max-width:640px;line-height:1.6;}
  .ended-count{
    margin-top:8px;padding:10px 28px;border-radius:28px;
    background:linear-gradient(90deg, rgba(230,194,96,0.14), rgba(230,194,96,0.05));
    border:1px solid rgba(230,194,96,0.3);
    font-family:var(--font-mono);font-size:16px;color:var(--ink-soft);letter-spacing:0.03em;
  }
  .ended-count .num{color:var(--gold-soft);font-weight:700;font-size:19px;}
  .ended-blessing{font-family:var(--font-display);font-style:italic;font-size:19px;color:var(--gold-dim);margin-top:2px;}

  /* ---- confetti ---- */
  .confetti-piece{position:fixed;top:-16px;pointer-events:none;z-index:5;border-radius:2px;opacity:0.9;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important;animation-iteration-count:1 !important;transition-duration:0.001s !important;}
    .particle{display:none;}
  }

  /* ---- smaller / non-1080p screens ---- */
  /* Card sizing itself is computed dynamically in JS (see computeCardLayout)
     so it always fits the actual viewport; these just tighten spacing. */
  @media (max-width:1400px){
    .stage{padding:18px 22px 14px;}
    .whos-here h2{font-size:22px;}
  }
  @media (max-width:900px){
    .whos-here h2{font-size:19px;}
  }
</style>
</head>

<script>
/* =========================================================
   TGLCC LIVE ATTENDANCE DISPLAY
   Reuses the same Supabase project & tables as the main
   TGLCC_Attendance_Record.html check-in page and TGLCC_Admin.html panel:
     - attendance_records (member_id, member_name, attendance_date[, created_at])
     - members (id, member_no, name, active, photo)
     - app_config (id=1: attendance_active, session_end_at, session_started_at)
       — read-only here, purely to reflect the admin's timer / end-session
       state; this page never writes to app_config or any other table.
========================================================= */

const SUPABASE_URL = 'https://vmbxnudsfsyknxekueqs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnhudWRzZnN5a254ZWt1ZXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDU2MTIsImV4cCI6MjA5ODk4MTYxMn0.OS8hP5rFKoCQuZKzxKvGmyoTdD24UT1qlbVd2KAGUzo';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);

// ---- tunables ----
const REFRESH_MS = 12000;      // how often we poll Supabase for new church-ins
const PAGE_ROTATE_MS = 9000;   // how long each grid page stays on screen (only used beyond CARDS_PER_PAGE)
const CARDS_PER_PAGE = 100;    // display fits up to 100 attendees on one screen at once, auto-sized to fit
const NEW_ARRIVAL_WINDOW_MS = 20 * 60 * 1000; // how long a card is eligible to be treated as "new" on first paint

const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let currentDate = todayStr();
let attendees = [];          // [{id, member_no, name, photo, checkedAt}] sorted, deduped, for currentDate
let knownIds = new Set();    // ids we've already rendered at least once (for detecting NEW arrivals)
let hasCreatedAtColumn = true; // becomes false if attendance_records has no created_at column
let pages = [[]];
let currentPage = 0;
let pageTimer = null;
let firstLoadDone = false;

// ---- Admin-controlled session (app_config table, id=1) ----
// Same table the TGLCC Admin panel writes to. If the table or row can't be
// read, this display falls back to always-open, so it keeps working even
// on setups that don't use the admin panel yet.
let sessionConfig = null;        // {attendance_active, session_end_at, session_started_at} or null
let hasConfigTable = true;
let hasSessionStartedAtColumn = true; // becomes false if session_started_at hasn't been added yet
let sessionOpen = true;          // current open/closed state, drives the ended screen
let countdownTicker = null;      // ticks the "Ends in ..." timer once a second

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getInitials(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  const first = parts[0][0] || '';
  const last = parts.length > 1 ? parts[parts.length-1][0] : '';
  return (first + last).toUpperCase();
}

// ---- today's date (shown in the upper-left welcome badge) ----
function fmtDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}
function updateWelcomeDate(){
  const el = $('welcomeDate');
  if(el) el.textContent = fmtDateLabel(currentDate);
}

// ---- silent date rollover ----
// The date shown in the welcome badge, and which attendance_date we query,
// both roll over to the new day automatically at midnight — no reload needed.
function checkDateRollover(){
  const t = todayStr();
  if(t !== currentDate){
    currentDate = t;
    knownIds = new Set();
    attendees = [];
    firstLoadDone = false;
    updateWelcomeDate();
    loadAttendance();
  }
}

// ---- Admin session config: powers the "Ends in ..." timer and the
// service-ended screen when the admin ends attendance from TGLCC_Admin.html ----
async function loadSessionConfig(){
  if(hasSessionStartedAtColumn){
    try{
      const { data, error } = await supabaseClient
        .from('app_config')
        .select('attendance_active,session_end_at,session_started_at')
        .eq('id', 1)
        .single();
      if(error) throw error;
      sessionConfig = data;
      hasConfigTable = true;
      applySessionState();
      return;
    }catch(e){
      hasSessionStartedAtColumn = false; // column not present — fall back below
    }
  }
  try{
    const { data, error } = await supabaseClient
      .from('app_config')
      .select('attendance_active,session_end_at')
      .eq('id', 1)
      .single();
    if(error) throw error;
    sessionConfig = data;
    hasConfigTable = true;
  }catch(e){
    // No app_config table/row set up yet — behave as always-open so this
    // display still works standalone without the admin panel.
    hasConfigTable = false;
    sessionConfig = null;
  }
  applySessionState();
}

function sessionIsOpenNow(){
  if(!hasConfigTable || !sessionConfig) return true;
  if(!sessionConfig.attendance_active) return false;
  if(sessionConfig.session_end_at && new Date(sessionConfig.session_end_at).getTime() <= Date.now()) return false;
  return true;
}

function formatCountdown(ms){
  if(ms <= 0) return '00:00';
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const mm = String(m).padStart(2,'0');
  const ss = String(s).padStart(2,'0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function stopCountdownTicker(){
  if(countdownTicker){ clearInterval(countdownTicker); countdownTicker = null; }
}

function startCountdownTicker(){
  stopCountdownTicker();
  const el = $('welcomeTimer');
  if(!el || !sessionConfig || !sessionConfig.session_end_at) return;
  el.style.display = '';
  const tick = () => {
    const ms = new Date(sessionConfig.session_end_at).getTime() - Date.now();
    if(ms <= 0){
      el.innerHTML = `Ends in <span class="count">00:00</span>`;
      stopCountdownTicker();
      loadSessionConfig(); // pick up the now-ended state promptly
      return;
    }
    el.innerHTML = `Ends in <span class="count">${formatCountdown(ms)}</span>`;
  };
  tick();
  countdownTicker = setInterval(tick, 1000);
}

// Called whenever fresh session config arrives — updates the timer badge
// and re-renders the grid area (live cards vs. the ended screen).
function applySessionState(){
  const wasOpen = sessionOpen;
  sessionOpen = sessionIsOpenNow();

  const timerEl = $('welcomeTimer');
  if(sessionOpen && sessionConfig && sessionConfig.session_end_at){
    startCountdownTicker();
  }else{
    stopCountdownTicker();
    if(timerEl) timerEl.style.display = 'none';
  }

  // Re-render whenever the open/closed state actually changes, or on the
  // very first load, so the display reflects the admin's session promptly.
  if(wasOpen !== sessionOpen || !firstLoadDone){
    renderAll([]);
  }
}

// ---- ambient particles / light rays ----
function initAmbience(){
  if(prefersReducedMotion) return;
  const field = $('particleField');
  const colors = ['rgba(230,194,96,0.55)','rgba(122,142,255,0.35)','rgba(255,255,255,0.25)'];
  for(let i=0;i<28;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random()*4;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = (Math.random()*100)+'vw';
    p.style.bottom = '-5vh';
    p.style.background = `radial-gradient(circle, ${colors[i%colors.length]} 0%, rgba(0,0,0,0) 70%)`;
    p.style.animationDuration = (14 + Math.random()*16)+'s';
    p.style.animationDelay = (Math.random()*16)+'s';
    field.appendChild(p);
  }
  for(let i=0;i<3;i++){
    const r = document.createElement('div');
    r.className = 'light-ray';
    r.style.left = (18 + i*32)+'vw';
    r.style.opacity = 0.5;
    field.appendChild(r);
  }
}

// ---- confetti (elegant, brief, only on a genuine new arrival) ----
function fireConfetti(){
  if(prefersReducedMotion) return;
  const colors = ['#e6c260','#f3dfa0','#ffffff','#7a8eff'];
  const count = 26;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 5 + Math.random()*5;
    piece.style.width = size+'px';
    piece.style.height = (size*0.5)+'px';
    piece.style.left = (40 + Math.random()*20)+'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(piece);
    const duration = 1800 + Math.random()*1200;
    const drift = (Math.random()-0.5)*220;
    piece.animate([
      { transform: piece.style.transform + ' translate(0,0)', opacity: 1 },
      { transform: `rotate(${Math.random()*720}deg) translate(${drift}px, 70vh)`, opacity: 0 }
    ], { duration, easing:'cubic-bezier(0.2,0.6,0.4,1)' });
    setTimeout(()=>piece.remove(), duration + 100);
  }
}

// ---- data loading ----
// Try selecting created_at (used for "most recently checked-in first" sort
// and for briefly badging genuinely new arrivals). If that column doesn't
// exist in this church's Supabase project yet, fall back gracefully and
// sort alphabetically instead, so the display still works out of the box.
async function fetchAttendanceRows(){
  if(hasCreatedAtColumn){
    try{
      const { data, error } = await supabaseClient
        .from('attendance_records')
        .select('member_id,member_name,attendance_date,created_at')
        .eq('attendance_date', currentDate);
      if(error) throw error;
      return data || [];
    }catch(e){
      hasCreatedAtColumn = false; // don't keep retrying the wider select every poll
    }
  }
  const { data, error } = await supabaseClient
    .from('attendance_records')
    .select('member_id,member_name,attendance_date')
    .eq('attendance_date', currentDate);
  if(error) throw error;
  return data || [];
}

async function loadAttendance(){
  try{
    const rows = await fetchAttendanceRows();

    // Dedupe by member_id (defensive, in case duplicate rows exist)
    const byId = new Map();
    for(const r of rows){
      if(!r.member_id) continue;
      if(!byId.has(r.member_id)) byId.set(r.member_id, r);
    }

    const ids = Array.from(byId.keys());
    let membersById = new Map();
    if(ids.length){
      const { data: memberRows, error: memberErr } = await supabaseClient
        .from('members')
        .select('id,member_no,name,photo')
        .in('id', ids);
      if(memberErr) throw memberErr;
      for(const m of (memberRows || [])) membersById.set(m.id, m);
    }

    let list = ids.map(id => {
      const rec = byId.get(id);
      const mem = membersById.get(id) || {};
      return {
        id,
        member_no: mem.member_no != null ? mem.member_no : '',
        name: mem.name || rec.member_name || 'Member',
        photo: (mem.photo || '').trim(),
        checkedAt: rec.created_at || null,
      };
    });

    // Sort: most recently checked-in first if we have timestamps, else alphabetically
    if(hasCreatedAtColumn && list.some(x => x.checkedAt)){
      list.sort((a,b) => new Date(b.checkedAt || 0) - new Date(a.checkedAt || 0));
    }else{
      list.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    }

    const newlyArrived = firstLoadDone ? list.filter(x => !knownIds.has(x.id)).map(x=>x.id) : [];
    attendees = list;
    for(const a of list) knownIds.add(a.id);

    renderAll(newlyArrived);
    firstLoadDone = true;
  }catch(e){
    console.error('Failed to load live attendance:', e);
  }
}

// ---- rendering ----
function buildCard(m, isNew){
  const initials = getInitials(m.name);
  const avatarInner = m.photo
    ? `<img src="${escapeHtml(m.photo)}" alt="${escapeHtml(m.name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-avatar-fallback',textContent:'${escapeHtml(initials)}'}))">`
    : `<div class="card-avatar-fallback">${escapeHtml(initials)}</div>`;
  return `
    <div class="member-card${isNew ? ' just-arrived' : ''}" data-id="${escapeHtml(String(m.id))}">
      ${isNew ? '<div class="arrived-badge">Just Arrived</div>' : ''}
      <div class="card-photo-wrap">${avatarInner}</div>
      <div class="card-name">${escapeHtml(m.name)}</div>
      <div class="card-id">${m.member_no ? 'Member ID: ' + escapeHtml(String(m.member_no)) : ''}</div>
    </div>
  `;
}

function paginate(list){
  const out = [];
  for(let i=0;i<list.length;i+=CARDS_PER_PAGE) out.push(list.slice(i, i+CARDS_PER_PAGE));
  return out.length ? out : [[]];
}

function stopPageRotation(){
  if(pageTimer){ clearInterval(pageTimer); pageTimer = null; }
}

function startPageRotationIfNeeded(){
  stopPageRotation();
  if(pages.length <= 1) return;
  pageTimer = setInterval(() => {
    goToPage((currentPage + 1) % pages.length);
  }, PAGE_ROTATE_MS);
}

function renderPageIndicator(){
  const ind = $('pageIndicator');
  if(pages.length <= 1){ ind.style.display = 'none'; return; }
  ind.style.display = '';
  const dots = pages.map((_, i) => `<span class="page-dot${i===currentPage?' active':''}"></span>`).join('');
  ind.innerHTML = `Page ${currentPage+1} of ${pages.length}<span class="page-dots">${dots}</span>`;
}

function goToPage(index, newIds){
  const area = $('gridArea');
  const existing = area.querySelector('.grid-page');
  currentPage = index;
  const html = renderGridPageHtml(pages[currentPage], newIds || []);

  if(!existing || prefersReducedMotion){
    area.innerHTML = html;
    renderPageIndicator();
    return;
  }

  existing.classList.add('leaving');
  setTimeout(() => {
    area.innerHTML = html;
    const fresh = area.querySelector('.grid-page');
    fresh.classList.add('entering');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => fresh.classList.remove('entering'));
    });
    renderPageIndicator();
  }, prefersReducedMotion ? 0 : 320);
}

// Figures out the largest card size (and matching column count) that lets
// `count` cards fit inside the grid area at once, with no scrolling —
// so whether there are 6 people or 100, every card is visible together
// and simply gets smaller as more people check in.
const CARD_GAP = 14;
const CARD_ASPECT = 1.32; // card height ≈ width * this, incl. photo + name + id
const MIN_CARD_W = 78;
const MAX_CARD_W = 200;

function computeCardLayout(count){
  const area = $('gridArea');
  const rect = area.getBoundingClientRect();
  const availW = Math.max(rect.width, 200);
  const availH = Math.max(rect.height, 200);
  const n = Math.max(count, 1);

  let best = { cols: 1, cardW: MIN_CARD_W };
  const maxCols = Math.min(n, 14);
  for(let cols = 1; cols <= maxCols; cols++){
    const rows = Math.ceil(n / cols);
    const wFit = (availW - CARD_GAP * (cols - 1)) / cols;
    const hFit = (availH - CARD_GAP * (rows - 1)) / rows / CARD_ASPECT;
    const cardW = Math.max(MIN_CARD_W, Math.min(MAX_CARD_W, Math.min(wFit, hFit)));
    if(cardW > best.cardW) best = { cols, cardW };
  }
  return best;
}

function computeColumns(count){
  return computeCardLayout(count).cols;
}

function renderGridPageHtml(list, newIds){
  const { cols, cardW } = computeCardLayout(list.length);
  const photoW = Math.round(cardW * 0.55);
  const nameFont = Math.max(10, Math.round(cardW * 0.11));
  const idFont = Math.max(8.5, Math.round(cardW * 0.085));
  const photoFont = Math.round(photoW * 0.34);
  const style = `grid-template-columns:repeat(${cols}, ${cardW}px);`
    + `--card-w:${cardW}px;--photo-w:${photoW}px;--name-font:${nameFont}px;--id-font:${idFont}px;--photo-font:${photoFont}px;`;
  const cardsHtml = list.map(m => buildCard(m, newIds.includes(m.id))).join('');
  return `<div class="grid-page" style="${style}">${cardsHtml}</div>`;
}

const CHURCH_LOGO_HTML = `<img src="${CHURCH_LOGO_SRC}" alt="Church logo">`;

function renderEndedScreen(){
  const area = $('gridArea');
  stopPageRotation();
  area.innerHTML = `
    <div class="ended-state">
      <div class="ended-icon">${CHURCH_LOGO_HTML}</div>
      <h3 class="ended-title">SERVICE HAS ENDED</h3>
      <p class="ended-sub">Thank you for worshiping with us today. We're grateful you joined our TGLCC family!</p>
      <div class="ended-count">Total Church-In Today: <span class="num">${attendees.length}</span></div>
      <p class="ended-blessing">God bless — see you next time!</p>
    </div>`;
  $('pageIndicator').style.display = 'none';
}

function renderAll(newlyArrivedIds){
  $('churchInCount').textContent = attendees.length;

  const stageEl = document.querySelector('.stage');
  if(stageEl) stageEl.classList.toggle('service-ended', !sessionOpen);

  if(!sessionOpen){
    renderEndedScreen();
    return;
  }

  const area = $('gridArea');

  if(!attendees.length){
    stopPageRotation();
    area.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${CHURCH_LOGO_HTML}</div>
        <h3 class="empty-title">WE'RE WAITING FOR YOU!</h3>
        <p class="empty-sub">Church-in to see your name here.</p>
      </div>`;
    $('pageIndicator').style.display = 'none';
    return;
  }

  pages = paginate(attendees);
  if(currentPage >= pages.length) currentPage = 0;

  // If the page currently on screen isn't page 0 but a new arrival just
  // landed, jump back to page 0 (most relevant page) so it's visible.
  if(newlyArrivedIds && newlyArrivedIds.length){
    currentPage = 0;
  }

  goToPage(currentPage, newlyArrivedIds);
  startPageRotationIfNeeded();

  if(newlyArrivedIds && newlyArrivedIds.length && firstLoadDone){
    fireConfetti();
  }
}

// ---- fullscreen shortcut ----
// Press "F" anywhere on this page to enter true browser Fullscreen mode
// (hides the address bar, tabs, and toolbar — not just F11's borderless
// window). Press "F" again, or Esc, to exit.
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(() => {});
  }else{
    document.exitFullscreen().catch(() => {});
  }
}
document.addEventListener('keydown', (e) => {
  if(e.key.toLowerCase() === 'f' && !e.ctrlKey && !e.metaKey && !e.altKey){
    toggleFullscreen();
  }
});

// ---- boot ----
let resizeRaf = null;
function handleResize(){
  if(resizeRaf) return;
  resizeRaf = requestAnimationFrame(() => {
    resizeRaf = null;
    if(sessionOpen && attendees.length) goToPage(currentPage);
  });
}

function init(){
  initAmbience();
  updateWelcomeDate();
  loadAttendance();
  loadSessionConfig();
  setInterval(loadAttendance, REFRESH_MS);
  setInterval(loadSessionConfig, 10000);
  setInterval(checkDateRollover, 30000);
  window.addEventListener('resize', handleResize);
}

init();
</script>
