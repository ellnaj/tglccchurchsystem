<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minutes of Meeting — The Greatest Love of Christ Church</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#FAF6EC;
    --surface:#FFFFFF;
    --ink:#292620;
    --ink-soft:#6E6B5D;
    --ink-faint:#A6A18D;
    --line:#E5DECB;
    --line-strong:#D3C9AC;
    --green:#3F52B6;
    --green-dark:#262F70;
    --green-tint:#E8ECFB;
    --gold:#B8862E;
    --gold-tint:#FBF0DA;
    --font-display:'Lora', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  button, a, input, select, textarea{touch-action:manipulation;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--green);outline-offset:2px;border-radius:6px;
  }
  .wrap{max-width:840px;margin:0 auto;padding:28px 20px 60px;}
  @media(max-width:900px){
    .wrap{padding:22px 16px 48px;}
  }

  /* ---- header ---- */
  .masthead{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px;
  }
  .masthead-left{display:flex;align-items:center;gap:12px;}
  .masthead-logo{
    width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;
    box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--line-strong), 0 2px 5px rgba(41,38,32,.15);
  }
  .church-name{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--green-dark);margin:0 0 2px;}
  .masthead h1{font-family:var(--font-display);font-weight:600;font-size:23px;margin:1px 0 0;letter-spacing:-0.01em;line-height:1.15;}
  .masthead-right{margin-left:auto;}
  .btn-admin-link{
    display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius);
    background:var(--green);border:1px solid var(--green);color:#fff;font-family:var(--font-body);
    font-size:13.5px;font-weight:700;text-decoration:none;white-space:nowrap;
    box-shadow:0 2px 6px rgba(63,82,182,0.35);cursor:pointer;
    transition:background .15s, border-color .15s, box-shadow .15s, transform .15s;
  }
  .btn-admin-link svg{width:16px;height:16px;flex-shrink:0;}
  .btn-admin-link:hover{background:var(--green-dark);border-color:var(--green-dark);box-shadow:0 4px 10px rgba(38,47,112,.32);transform:translateY(-1px);}
  .btn-admin-link:active{transform:translateY(0);}
  .intro-note{
    background:var(--green-tint);border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:10px 14px;font-size:13.5px;color:var(--green-dark);font-weight:600;
    margin:14px 0;
  }
  /* ---- footer ---- */
  .app-footer{
    margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    text-align:center;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);
  }
  @media(max-width:640px){
    .masthead{padding-bottom:10px;margin-bottom:12px;}
    .masthead-logo{width:38px;height:38px;}
    .masthead h1{font-size:19px;}
    .masthead-right{margin-left:0;}
    .btn-admin-link{padding:8px 13px;font-size:12.5px;}
  }
  @media(max-width:420px){
    .btn-admin-link .btn-admin-label{display:none;}
    .btn-admin-link{padding:10px;border-radius:50%;}
    .btn-admin-link svg{width:18px;height:18px;}
  }

  /* ---- sticky controls (search + prev/next stay pinned at top) ---- */
  .sticky-controls{
    position:sticky;top:0;z-index:20;background:var(--paper);
    padding-top:6px;padding-bottom:8px;margin-bottom:2px;border-bottom:1px solid var(--line);
  }

  /* ---- toolbar / filters ---- */
  .toolbar{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 14px;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
    padding:6px;box-shadow:0 2px 6px rgba(41,38,32,.07);
  }
  .btn-print{
    display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);
    font-family:var(--font-body);font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    min-height:44px;flex-shrink:0;transition:background .15s, border-color .15s, box-shadow .15s, transform .15s;
  }
  .btn-print svg{width:16px;height:16px;flex-shrink:0;color:var(--green-dark);}
  .btn-print:hover:not(:disabled){background:var(--green-tint);border-color:var(--green);box-shadow:0 2px 6px rgba(63,82,182,.15);transform:translateY(-1px);}
  .btn-print:active:not(:disabled){transform:translateY(0);}
  .btn-print:disabled{opacity:.45;cursor:not-allowed;}
  .search-wrap{position:relative;flex:1;min-width:180px;}
  .search-wrap svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--ink-faint);pointer-events:none;
  }
  .search{
    width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line-strong);
    border-radius:8px;background:var(--surface);font-family:var(--font-body);font-size:16px;color:var(--ink);
    min-height:44px;transition:border-color .15s, box-shadow .15s;
  }
  .search:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint);}
  .select-wrap{position:relative;flex-shrink:0;}
  .select-wrap svg{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;color:var(--ink-faint);pointer-events:none;
  }
  select.filter{
    -webkit-appearance:none;appearance:none;
    padding:9px 30px 9px 12px;border:1px solid var(--line-strong);border-radius:8px;
    background:var(--surface);font-family:var(--font-body);font-size:16px;color:var(--ink);
    min-height:44px;cursor:pointer;transition:border-color .15s, box-shadow .15s;
  }
  select.filter:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-tint);}
  @media(max-width:640px){
    .toolbar{gap:6px;padding:6px;}
    .btn-print{flex:1 1 100%;justify-content:center;order:1;}
    .search-wrap{flex:1 1 100%;order:-1;min-width:0;}
    .select-wrap{flex:1 1 100%;order:2;}
    select.filter{width:100%;}
  }

  /* ---- meeting list ---- */
  .mom-list{display:flex;flex-direction:column;gap:10px;}
  .mom-row{
    background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    transition:border-color .15s, background .15s;min-height:44px;
  }
  .mom-row:hover{border-color:var(--green);background:#fff;}
  .mom-row .mom-row-date{
    font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);min-width:96px;
  }
  .mom-row .mom-row-main{flex:1;min-width:180px;}
  .mom-row .mom-row-title{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:var(--ink);}
  .mom-row .mom-row-presider{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .mom-row .mom-row-arrow{font-size:18px;color:var(--ink-faint);}
  @media(max-width:480px){
    .mom-row{gap:4px 12px;padding:13px 14px;}
    .mom-row .mom-row-date{min-width:0;order:-1;flex:1 0 100%;}
    .mom-row .mom-row-main{min-width:0;}
    .mom-row .mom-row-arrow{display:none;}
  }

  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;
    border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface);
  }
  .loading-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;}
  .count-label{font-size:12px;color:var(--ink-faint);margin:2px 2px 4px;}

  /* ---- modal / mom-doc (same layout as the system preview) ---- */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(41,38,32,.45);
    padding:24px;overflow-y:auto;z-index:50;-webkit-overflow-scrolling:touch;
  }
  .modal-overlay.open{display:block;}
  @media(max-width:640px){
    .modal-overlay{padding:12px;}
  }
  .mom-preview-modal{
    max-width:760px;margin:0 auto;max-height:none;background:var(--surface);
    border-radius:var(--radius);box-shadow:0 20px 50px -12px rgba(41,38,32,.35), 0 8px 20px rgba(41,38,32,.15);
  }
  .mom-doc{background:#fff;padding:26px 24px;font-family:var(--font-body);color:var(--ink);border-radius:var(--radius) var(--radius) 0 0;}
  .mom-print-header{display:none;}
  .mom-doc h1{font-family:var(--font-display);font-weight:700;font-size:23px;text-align:center;letter-spacing:0.09em;margin:0 0 8px;color:var(--green-dark);}
  .mom-doc .mom-title-line{font-family:var(--font-display);font-weight:600;font-size:16.5px;text-align:center;color:var(--ink);margin-bottom:6px;}
  .mom-doc .mom-date{text-align:center;font-family:var(--font-mono);font-size:12px;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:8px;}
  .mom-doc .mom-rule{
    border:none;height:2px;width:64px;margin:0 auto 22px;border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .mom-doc h3{font-family:var(--font-display);font-weight:600;font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--green-dark);margin:24px 0 10px;border-bottom:1px solid var(--line-strong);padding-bottom:5px;}
  .mom-doc p{margin:0 0 8px;font-size:13.5px;line-height:1.6;}
  .mom-doc ul, .mom-doc ol{margin:0 0 8px;padding-left:22px;font-size:13.5px;line-height:1.6;}
  .mom-doc b, .mom-doc strong{font-weight:700;}
  .mom-doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;}
  .mom-doc th, .mom-doc td{border:1px solid var(--line-strong);padding:6px 8px;text-align:left;}
  .mom-doc th{font-family:var(--font-display);font-weight:600;background:var(--paper);}
  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px;}
  .table-scroll table{margin-bottom:0;}
  @media(max-width:480px){
    .mom-doc{padding:20px 16px;}
    .mom-doc table{min-width:420px;}
  }
  .mom-sign{margin-top:60px;text-align:center;width:180px;margin-left:auto;margin-right:auto;}
  .mom-sign .mom-sign-line{border-top:1px solid var(--line-strong);padding-top:4px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--ink);}
  .mom-sign .mom-sign-cap{font-family:var(--font-body);font-size:10.5px;color:var(--ink-soft);}
  .mom-attendee-grid{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px;}
  .mom-attendee-card{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:20px;
    padding:4px 10px 4px 4px;background:var(--paper);
  }
  .mom-att-avatar{
    width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg, var(--green), var(--green-dark));
    color:#fff;font-size:10px;font-weight:700;box-shadow:0 1px 2px rgba(38,47,112,.25);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-body);
  }
  .mom-att-name{font-size:12px;font-weight:600;color:var(--ink);}
  .muted{color:var(--ink-soft);}

  .modal-close-bar{
    display:flex;justify-content:flex-end;padding:12px 24px;border-top:1px solid var(--line);
  }
  .btn-close{
    padding:9px 18px;border-radius:var(--radius);border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);
    min-height:44px;transition:background .15s;
  }
  .btn-close:hover{background:var(--paper);}

  /* ---- preview nav (prev/next) ---- */
  .preview-nav{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 0 16px;
  }
  .btn-nav{
    padding:9px 16px;border-radius:var(--radius);border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);
    min-height:44px;transition:background .15s, border-color .15s, transform .15s;
  }
  .btn-nav:hover:not(:disabled){background:var(--paper);border-color:var(--green);transform:translateY(-1px);}
  .btn-nav:active:not(:disabled){transform:translateY(0);}
  .btn-nav:disabled{opacity:.4;cursor:not-allowed;}
  .preview-nav-count{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .preview-doc-wrap{
    background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
    max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  @media(max-width:480px){
    .btn-nav{padding:9px 12px;font-size:13px;}
  }

  /* ---- comments / corrections ---- */
  .comments-section{
    margin-top:16px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:18px 20px;box-shadow:0 1px 3px rgba(41,38,32,.05);
  }
  .comments-title{
    font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--green-dark);margin:0 0 12px;border-bottom:1px solid var(--line-strong);padding-bottom:8px;
  }
  .comment-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .comment-item{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;
  }
  .comment-item-head{display:flex;justify-content:flex-end;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .comment-item-date{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
  .comment-item-text{font-size:13px;line-height:1.55;color:var(--ink);white-space:pre-wrap;}
  .comment-empty, .comment-loading{font-size:13px;color:var(--ink-soft);padding:6px 2px;}
  .comment-reply-toggle{
    margin-top:6px;background:none;border:none;padding:6px 0;font-family:var(--font-body);font-size:12px;
    font-weight:600;color:var(--green);cursor:pointer;min-height:32px;
  }
  .comment-reply-toggle:hover{color:var(--green-dark);text-decoration:underline;}
  .comment-reply-form{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .comment-replies{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-left:14px;border-left:2px solid var(--line-strong);}
  .comment-item.comment-reply{background:var(--surface);}
  .comment-form{display:flex;flex-direction:column;gap:8px;}
  .comment-input, .comment-textarea{
    width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);
    background:var(--surface);font-family:var(--font-body);font-size:16px;color:var(--ink);resize:vertical;
  }
  .comment-input:focus, .comment-textarea:focus{outline:none;border-color:var(--green);}
  .btn-comment{
    align-self:flex-end;padding:9px 18px;border-radius:var(--radius);border:1px solid var(--green);
    background:var(--green);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);
    min-height:44px;transition:background .15s, border-color .15s, box-shadow .15s, transform .15s;
  }
  .btn-comment:hover{background:var(--green-dark);border-color:var(--green-dark);box-shadow:0 3px 8px rgba(38,47,112,.25);transform:translateY(-1px);}
  .btn-comment:active{transform:translateY(0);}
  .btn-comment-sm{padding:7px 14px;font-size:13px;min-height:40px;}
  @media(max-width:640px){
    .preview-doc-wrap{max-height:56vh;}
    .btn-comment{align-self:stretch;}
    .comments-section{padding:16px;}
  }
  @media(max-width:420px){
    .comment-item-head{justify-content:flex-start;}
  }

  /* ---- print / save as PDF (isolates just the meeting document) ---- */
  @media print{
    @page{
      size: A4 portrait;
      margin: 16mm 15mm 18mm;
    }
    html, body{background:#fff;}
    body{font-size:12px;}
    /* Make sure text/border colors (headings, gold rule, table header
       shading) come through in the printed/PDF output instead of being
       silently dropped, which is the default browser behavior for print. */
    *{
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
      color-adjust:exact;
    }
    .masthead, .masthead-right, .intro-note, .sticky-controls, .app-footer,
    .comments-section, .preview-nav{display:none !important;}
    .wrap{max-width:100%;padding:0;margin:0;}
    .preview-doc-wrap{max-height:none;overflow:visible;border:none;}
    .mom-doc{padding:0;}
    .mom-print-header{
      display:flex;align-items:center;gap:10px;
      border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px;
      page-break-after:avoid;break-after:avoid-page;page-break-inside:avoid;break-inside:avoid;
    }
    .mom-print-header img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;}
    .mom-print-header span{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--green-dark);}

    /* Keep each heading glued to the content that follows it, instead of
       being stranded alone at the bottom of a page. */
    .mom-doc h1, .mom-doc .mom-title-line, .mom-doc .mom-date, .mom-doc h3{
      page-break-after:avoid;break-after:avoid-page;
      page-break-inside:avoid;break-inside:avoid;
    }
    .mom-doc .mom-rule{page-break-after:avoid;break-after:avoid-page;}

    /* Never split a paragraph or list item across a page boundary, and
       keep a sensible minimum of lines together if it must wrap. */
    .mom-doc p, .mom-doc li{
      orphans:3;widows:3;
      page-break-inside:avoid;break-inside:avoid;
    }

    /* Tables: repeat the header row on every page the table spans, and
       never split a single row across two pages. The table itself is
       still allowed to break between rows. */
    .table-scroll{overflow:visible;}
    .mom-doc table{min-width:0 !important;width:100%;page-break-inside:auto;break-inside:auto;}
    .mom-doc thead{display:table-header-group;}
    .mom-doc tfoot{display:table-footer-group;}
    .mom-doc tr{page-break-inside:avoid;break-inside:avoid;}

    /* Attendee list: the grid as a whole may flow across pages, but never
       cut a single attendee card in half. */
    .mom-attendee-grid{page-break-inside:auto;}
    .mom-attendee-card{page-break-inside:avoid;break-inside:avoid;}

    /* Signature block always stays intact on one page. */
    .mom-sign{page-break-inside:avoid;break-inside:avoid;margin-top:60px;}
  }
</style>
</head>
<body>

<div class="wrap">

<script>
const SUPABASE_URL = 'https://vmbxnudsfsyknxekueqs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnhudWRzZnN5a254ZWt1ZXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDU2MTIsImV4cCI6MjA5ODk4MTYxMn0.OS8hP5rFKoCQuZKzxKvGmyoTdD24UT1qlbVd2KAGUzo';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function $(id){ return document.getElementById(id); }

function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : '';
  const last = parts.length>1 ? parts[parts.length-1][0] : '';
  return (first+last).toUpperCase();
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

let momList = [];
let filteredList = [];
let currentIndex = 0;

function dbRowToMom(r){
  return {
    id: r.id,
    date: r.meeting_date || '',
    title: r.title || '',
    presider: r.presider || '',
    notes: r.notes || '',
    actionItems: Array.isArray(r.action_items) ? r.action_items : [],
    attendees: [],
  };
}

async function loadMOM(){
  try{
    const [mmRes, attRes] = await Promise.all([
      supabaseClient.from('meeting_minutes').select('*').order('meeting_date', { ascending:false }),
      supabaseClient.from('meeting_attendance').select('*'),
    ]);
    if(mmRes.error) throw mmRes.error;
    const list = (mmRes.data || []).map(dbRowToMom);
    const byId = new Map(list.map(m=>[m.id, m]));
    (attRes.data || []).forEach(a=>{
      const m = byId.get(a.meeting_id);
      if(m) m.attendees.push(a.member_name || '');
    });
    momList = list;
  }catch(e){
    console.error('Failed to load meeting minutes:', e);
    $('listArea').innerHTML = '<div class="empty-state">Unable to load meeting minutes right now. Please check your connection and try again.</div>';
    return;
  }
  populateFilters();
  applyFilters(true);
}

function populateFilters(){
  const yearSel = $('yearFilter');
  const prevYear = yearSel.value;
  const years = Array.from(new Set(momList.map(m=>(m.date||'').slice(0,4)).filter(Boolean))).sort((a,b)=>b.localeCompare(a));
  yearSel.innerHTML = '<option value="">All Years</option>' + years.map(y=>`<option value="${y}" ${y===prevYear?'selected':''}>${y}</option>`).join('');
}

function onFiltersChanged(){
  applyFilters(true);
}

function applyFilters(resetIndex){
  const q = ($('searchBox').value || '').trim().toLowerCase();
  const yearQ = $('yearFilter').value;

  let list = momList.filter(m=>{
    if(q){
      const hay = [(m.title||''), (m.presider||''), (m.date||''), (m.date?fmtDate(m.date):'')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(yearQ && (m.date||'').slice(0,4) !== yearQ) return false;
    return true;
  });
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  filteredList = list;
  if(resetIndex) currentIndex = 0;
  if(currentIndex >= filteredList.length) currentIndex = Math.max(0, filteredList.length - 1);

  renderCurrent();
}

function renderCurrent(){
  const area = $('listArea');
  const nav = $('previewNav');
  const printBtn = $('printBtn');

  if(!filteredList.length){
    nav.style.display = 'none';
    area.innerHTML = '<div class="empty-state">No meeting minutes match your search.</div>';
    if(printBtn) printBtn.disabled = true;
    return;
  }

  if(printBtn) printBtn.disabled = false;
  nav.style.display = 'flex';
  $('previewNavCount').textContent = `${currentIndex + 1} of ${filteredList.length}`;
  $('prevBtn').disabled = currentIndex >= filteredList.length - 1;
  $('nextBtn').disabled = currentIndex <= 0;

  if(!$('printArea')){
    area.innerHTML = '<div class="preview-doc-wrap"><div id="printArea" class="mom-doc"></div></div><div class="comments-section" id="commentsSection"></div>';
  }

  const m = filteredList[currentIndex];

  const validActionItems = (m.actionItems||[]).filter(a=>a && (a.item||'').trim());
  const actionRows = validActionItems.length
    ? validActionItems.map(a=>`<tr><td>${escapeHtml(a.item)}</td><td>${escapeHtml(a.assignedTo)}</td><td>${escapeHtml(a.status)}</td></tr>`).join('')
    : '';
  const actionItemsSection = validActionItems.length
    ? `<h3>Action Items</h3>
    <div class="table-scroll"><table><thead><tr><th>Action Item</th><th>Assigned To</th><th>Status</th></tr></thead><tbody>${actionRows}</tbody></table></div>`
    : '';

  const attendeeNames = (m.attendees||[]).filter(Boolean).sort((a,b)=>a.localeCompare(b));
  const attendeesSection = attendeeNames.length
    ? `<h3>Ministry Leadership Attendees</h3>
    <div class="mom-attendee-grid">${attendeeNames.map(name=>`
        <div class="mom-attendee-card">
          <div class="mom-att-avatar">${initials(name)}</div>
          <span class="mom-att-name">${escapeHtml(name)}</span>
        </div>`).join('')}</div>`
    : '';
  const presiderSection = (m.presider && m.presider.trim())
    ? `<div class="mom-sign">
      <div class="mom-sign-line">${escapeHtml(m.presider)}</div>
      <div class="mom-sign-cap">Presider</div>
    </div>`
    : '';

  const mastheadLogoEl = document.querySelector('.masthead-logo');
  const printHeader = mastheadLogoEl
    ? `<div class="mom-print-header"><img src="${mastheadLogoEl.src}" alt="Church logo"><span>The Greatest Love of Christ Church</span></div>`
    : '';

  $('printArea').innerHTML = `
    ${printHeader}
    <h1>MINUTES OF MEETING</h1>
    <div class="mom-title-line">${escapeHtml(m.title)}</div>
    <div class="mom-date">DATE: ${m.date ? fmtDate(m.date) : '—'}</div>
    <hr class="mom-rule">
    ${m.notes || '<p class="muted">No notes recorded.</p>'}
    ${actionItemsSection}
    ${attendeesSection}
    ${presiderSection}
  `;

  const docWrap = document.querySelector('.preview-doc-wrap');
  if(docWrap) docWrap.scrollTop = 0;

  loadAndRenderComments(m.id);
}

let currentCommentsMeetingId = null;
let lastCommentsData = [];
let openReplyId = null;

function fmtDateTime(ts){
  if(!ts) return '';
  const dt = new Date(ts);
  if(isNaN(dt.getTime())) return '';
  return dt.toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
}

function buildCommentTree(rows){
  const byId = new Map();
  rows.forEach(r=>byId.set(r.id, Object.assign({}, r, { replies: [] })));
  const roots = [];
  byId.forEach(c=>{
    if(c.parent_id && byId.has(c.parent_id)){
      byId.get(c.parent_id).replies.push(c);
    }else{
      roots.push(c);
    }
  });
  return roots;
}

function commentItemHtml(c, isReply){
  const showReplyForm = openReplyId === c.id;
  const repliesHtml = (c.replies && c.replies.length)
    ? `<div class="comment-replies">${c.replies.map(r=>commentItemHtml(r, true)).join('')}</div>`
    : '';
  return `
    <div class="comment-item ${isReply ? 'comment-reply' : ''}">
      <div class="comment-item-head">
        <span class="comment-item-date">${fmtDateTime(c.created_at)}</span>
      </div>
      <div class="comment-item-text">${escapeHtml(c.comment_text)}</div>
      <button type="button" class="comment-reply-toggle" data-reply-toggle="${c.id}">Reply</button>
      <div class="comment-reply-form" style="display:${showReplyForm ? 'flex' : 'none'};">
        <textarea class="comment-textarea" id="replyText_${c.id}" placeholder="Write a reply…" rows="2"></textarea>
        <button type="button" class="btn-comment btn-comment-sm" data-reply-submit="${c.id}">Post Reply</button>
      </div>
      ${repliesHtml}
    </div>
  `;
}

function commentListHtml(comments, loading, errored){
  if(loading) return '<div class="comment-loading">Loading comments…</div>';
  if(errored) return '<div class="comment-empty">Comments are unavailable right now. Please try again later.</div>';
  if(!comments.length) return '<div class="comment-empty">No comments yet. Be the first to leave feedback.</div>';
  const tree = buildCommentTree(comments);
  return tree.map(c=>commentItemHtml(c, false)).join('');
}

function renderCommentsBox(comments, loading, errored){
  const box = $('commentsSection');
  if(!box) return;
  box.innerHTML = `
    <h3 class="comments-title">Comments &amp; Corrections</h3>
    <div class="comment-list">${commentListHtml(comments, loading, errored)}</div>
    <div class="comment-form">
      <textarea class="comment-textarea" id="commentText" placeholder="Comments and corrections" rows="3"></textarea>
      <button type="button" class="btn-comment" id="commentPostBtn">Post Comment</button>
    </div>
  `;

  const postBtn = $('commentPostBtn');
  if(postBtn) postBtn.onclick = () => submitComment(currentCommentsMeetingId, null);

  box.querySelectorAll('[data-reply-toggle]').forEach(btn=>{
    btn.onclick = () => {
      const id = btn.getAttribute('data-reply-toggle');
      openReplyId = (openReplyId === id) ? null : id;
      renderCommentsBox(lastCommentsData, false, false);
    };
  });
  box.querySelectorAll('[data-reply-submit]').forEach(btn=>{
    btn.onclick = () => {
      const id = btn.getAttribute('data-reply-submit');
      submitComment(currentCommentsMeetingId, id);
    };
  });
}

async function loadAndRenderComments(meetingId){
  currentCommentsMeetingId = meetingId;
  openReplyId = null;
  renderCommentsBox([], true, false);
  try{
    const { data, error } = await supabaseClient
      .from('meeting_comments')
      .select('*')
      .eq('meeting_id', meetingId)
      .order('created_at', { ascending: true });
    if(error) throw error;
    if(currentCommentsMeetingId !== meetingId) return;
    lastCommentsData = data || [];
    renderCommentsBox(lastCommentsData, false, false);
  }catch(e){
    console.error('Failed to load comments:', e);
    if(currentCommentsMeetingId !== meetingId) return;
    lastCommentsData = [];
    renderCommentsBox([], false, true);
  }
}

async function submitComment(meetingId, parentId){
  if(!meetingId) return;
  const textEl = parentId ? $(`replyText_${parentId}`) : $('commentText');
  const text = (textEl && textEl.value || '').trim();
  if(!text){
    alert('Please enter a comment.');
    return;
  }
  const btn = parentId ? document.querySelector(`[data-reply-submit="${parentId}"]`) : $('commentPostBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Posting…'; }
  try{
    const { error } = await supabaseClient
      .from('meeting_comments')
      .insert([{ meeting_id: meetingId, parent_id: parentId || null, comment_text: text }]);
    if(error) throw error;
    openReplyId = null;
    loadAndRenderComments(meetingId);
  }catch(e){
    console.error('Failed to post comment:', e);
    alert('Unable to post your comment right now. Please try again later.');
    if(btn){ btn.disabled = false; btn.textContent = parentId ? 'Post Reply' : 'Post Comment'; }
  }
}

function printCurrentMOM(){
  if(!filteredList.length || !$('printArea')){
    alert('No meeting minutes to print yet.');
    return;
  }
  window.print();
}

function prevMeeting(){
  if(currentIndex < filteredList.length - 1){
    currentIndex++;
    renderCurrent();
  }
}
function nextMeeting(){
  if(currentIndex > 0){
    currentIndex--;
    renderCurrent();
  }
}

loadMOM();
</script>
</body>
</html>
