<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGLCC Attendance Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#FAF6EC;
    --surface:#FFFFFF;
    --ink:#292620;
    --ink-soft:#6E6B5D;
    --ink-faint:#A6A18D;
    --line:#E5DECB;
    --line-strong:#D3C9AC;
    --green:#3F52B6;
    --green-dark:#262F70;
    --green-tint:#E8ECFB;
    --gold:#B8862E;
    --gold-tint:#FBF0DA;
    --red:#A33F3F;
    --red-tint:#F7E8E6;
    --font-display:'Lora', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{
    margin:0;color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(680px 420px at 100% -8%, var(--green-tint) 0%, rgba(232,236,251,0) 70%),
      radial-gradient(560px 360px at -8% 0%, var(--gold-tint) 0%, rgba(251,240,218,0) 70%),
      var(--paper);
    min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  }
  .app{max-width:760px;margin:0 auto;padding:28px 24px 80px;}
  button, a, .member-row, input{touch-action:manipulation;}
  img{max-width:100%;}

  /* ---- header ---- */
  .masthead{
    border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px;
    display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;
  }
  .masthead-left{display:flex;align-items:center;gap:14px;}
  .masthead-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .church-name{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--green-dark);margin:0 0 2px;}
  .masthead h1{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;letter-spacing:-0.01em;}
  .masthead-right{text-align:right;}
  .today-date{
    font-family:var(--font-mono);font-size:14px;font-weight:400;color:var(--ink);
    display:flex;align-items:center;gap:6px;justify-content:flex-end;white-space:nowrap;
  }
  .today-greeting{font-size:13px;color:var(--ink-soft);margin-top:4px;}

  button{font-family:var(--font-body);cursor:pointer;}
  .btn{
    padding:9px 14px;border-radius:var(--radius);border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;
    text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
  }
  .btn:hover{background:var(--paper);}
  .btn-primary{background:var(--green);color:#fff;border-color:var(--green);}
  .btn-primary:hover{background:var(--green-dark);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-block{width:100%;padding:13px;font-size:15px;}
  .btn[disabled]{opacity:0.5;cursor:not-allowed;}

  /* ---- toolbar: date pill (left) + new member (right) ---- */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px;}

  .date-pill{
    position:relative;display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:11px 18px;box-shadow:0 2px 8px rgba(41,38,32,0.04);
  }
  #dateLabel{font-weight:700;font-size:16px;color:var(--ink);}
  .date-pill-chevron{font-size:11px;color:var(--ink-faint);}
  .date-pill input[type="date"]{
    position:absolute;inset:0;opacity:0;border:none;padding:0;margin:0;width:100%;height:100%;cursor:pointer;
  }
  .date-pill input[type="date"][disabled]{cursor:default;}

  input[type="date"]{font-family:var(--font-body);font-size:16px;color:var(--ink);}
  input:focus{outline:none;}
  .search{
    padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);
    background:var(--surface);font-family:var(--font-body);font-size:16px;color:var(--ink);
    flex:1;min-width:160px;width:100%;
  }
  .search:focus{border-color:var(--green);}

  /* ---- verse ---- */
  .verse-card{
    background:var(--green-tint);border:1px solid var(--line);border-radius:14px;
    padding:14px 18px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;
    font-size:14.5px;color:var(--green-dark);font-style:italic;line-height:1.6;
  }
  .verse-card .quote-mark{font-family:var(--font-display);font-style:normal;font-size:24px;line-height:0.8;color:var(--green);flex-shrink:0;margin-top:2px;}

  /* ---- status pill ---- */
  .status-pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:20px;
    font-family:var(--font-mono);font-size:11.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;
  }
  .status-pill.pending{background:var(--gold-tint);color:var(--gold);}
  .status-pill.active{background:var(--green-tint);color:var(--green-dark);}
  .status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .status-dot.pulse{animation:statusPulse 1.6s ease-in-out infinite;}
  @keyframes statusPulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  /* ---- closed / hero state ---- */
  .hero-card{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:44px 24px;margin-bottom:20px;text-align:center;
  }
  .hero-card h2{font-family:var(--font-display);font-weight:700;font-size:27px;margin:18px 0 8px;letter-spacing:-0.01em;}
  .hero-card p{color:var(--ink-soft);font-size:14.5px;margin:0 auto;max-width:400px;line-height:1.65;}
  .hero-card .service-time{
    display:inline-block;margin-top:16px;font-family:var(--font-mono);font-size:13px;font-weight:600;
    color:var(--green-dark);background:var(--green-tint);border-radius:20px;padding:6px 16px;
  }

  /* ---- open session bar ---- */
  .session-bar{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;margin-bottom:20px;
  }
  .session-stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;}
  .stat-item{flex:1;min-width:110px;}
  .stat-item .stat-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:3px;}
  .stat-item .stat-value{font-size:16px;font-weight:700;color:var(--ink);}
  .stat-item .stat-value.countdown{font-family:var(--font-mono);color:var(--green-dark);}

  .search-wrap{margin-bottom:8px;}
  .search-hint{font-size:13px;color:var(--ink-soft);margin:8px 2px 18px;line-height:1.55;}

  .results-wrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-bottom:18px;}
  .member-row{
    display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);
    cursor:pointer;user-select:none;
  }
  .member-row:last-child{border-bottom:none;}
  .member-row:hover{background:var(--paper);}
  .member-row .m-no{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);width:34px;flex-shrink:0;}
  .member-row .m-name{font-size:14.5px;font-weight:600;flex:1;}
  .member-row .m-go{font-size:12px;font-family:var(--font-mono);color:var(--green-dark);font-weight:700;}

  .confirm-card{
    background:var(--green-tint);border:1px solid var(--green);border-radius:16px;
    padding:20px;margin-bottom:18px;text-align:center;
  }
  .confirm-card .c-label{font-size:12px;color:var(--green-dark);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;}
  .confirm-card .c-name{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--ink);margin-bottom:2px;}
  .confirm-card .c-no{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin-bottom:18px;}
  .confirm-actions{display:flex;gap:10px;justify-content:center;}

  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{font-family:var(--font-display);font-weight:500;color:var(--ink);margin-bottom:6px;}

  .success-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:28px 20px;margin-bottom:18px;text-align:center;
  }
  .success-check{
    width:52px;height:52px;border-radius:50%;background:var(--green-tint);color:var(--green-dark);
    display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;
  }
  .success-card h3{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0 0 4px;}
  .success-card p{color:var(--ink-soft);font-size:13px;margin:0;}

  .hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5;}

  .banner{
    display:none;padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;
    font-size:13px;line-height:1.5;
  }
  .banner.show{display:block;}
  .banner.error{background:var(--red-tint);color:var(--red);border:1px solid var(--red);}
  .banner.ok{background:var(--green-tint);color:var(--green-dark);border:1px solid var(--green);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity 0.2s ease, transform 0.2s ease;z-index:2000;
  }
  .toast.show{opacity:1;transform:translateY(-4px);}

  .app-footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);line-height:1.6;}
  .app-footer a{color:var(--ink-faint);}

  /* ---- mobile tuning ---- */
  @media (max-width:480px){
    .app{padding:20px 16px 64px;}
    .masthead{gap:10px;}
    .masthead h1{font-size:20px;}
    .masthead-logo{width:44px;height:44px;}
    .masthead-right{text-align:left;width:100%;}
    .today-date{justify-content:flex-start;}
    .toolbar{gap:10px;}
    .date-pill{padding:10px 14px;flex:1;justify-content:center;}
    .btn-primary[href]{flex:1;text-align:center;}
    .verse-card{font-size:14px;padding:12px 14px;}
    .session-stats{gap:16px;}
    .hero-card{padding:32px 18px;}
    .hero-card h2{font-size:22px;}
  }
  @media (max-width:360px){
    .masthead h1{font-size:18px;}
    .church-name{font-size:10.5px;}
  }
</style>
</head>

<script>
const $ = (id) => document.getElementById(id);

const SUPABASE_URL = 'https://vmbxnudsfsyknxekueqs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYnhudWRzZnN5a254ZWt1ZXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDU2MTIsImV4cCI6MjA5ODk4MTYxMn0.OS8hP5rFKoCQuZKzxKvGmyoTdD24UT1qlbVd2KAGUzo';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let members = [];            // active members: {id, member_no, name}
let checkedInIds = new Set(); // member ids already checked in for currentDate
let currentDate = todayStr();
let selectedMember = null;    // member picked from search results, awaiting confirm

// ---- Admin-controlled attendance session (app_config table) ----
// If the app_config table doesn't exist yet, or the row can't be read,
// the app falls back to its original always-open behavior so existing
// setups keep working exactly as before.
let sessionConfig = null;     // {attendance_active, attendance_date, session_end_at, session_started_at} or null
let hasConfigTable = true;    // becomes false if app_config is missing/unreadable
let hasStartedAtColumn = true; // becomes false if session_started_at hasn't been added to app_config yet
let countdownTicker = null;   // live "auto-ends in" ticker, ticks every second while a session is open

function sessionIsOpen(){
  if(!hasConfigTable || !sessionConfig) return true; // fallback: always open
  if(!sessionConfig.attendance_active) return false;
  if(sessionConfig.session_end_at && new Date(sessionConfig.session_end_at).getTime() <= Date.now()) return false;
  return true;
}

async function loadSessionConfig(){
  // Try with session_started_at first (used to show the "Started" time);
  // if that column doesn't exist yet in this church's Supabase project,
  // fall back to the original columns so the app still works.
  if(hasStartedAtColumn){
    try{
      const { data, error } = await supabaseClient
        .from('app_config')
        .select('attendance_active,attendance_date,session_end_at,session_started_at')
        .eq('id', 1)
        .single();
      if(error) throw error;
      sessionConfig = data;
      hasConfigTable = true;
      return;
    }catch(e){
      hasStartedAtColumn = false; // don't keep retrying the wider select every poll
    }
  }
  try{
    const { data, error } = await supabaseClient
      .from('app_config')
      .select('attendance_active,attendance_date,session_end_at')
      .eq('id', 1)
      .single();
    if(error) throw error;
    sessionConfig = data;
    hasConfigTable = true;
  }catch(e){
    // Table not present, no row yet, or unreachable — behave like the
    // original app (attendance always open, date picker fully manual).
    hasConfigTable = false;
    sessionConfig = null;
  }
}

// If a session was open but its auto-end time has passed, flip it closed
// in the database too (best-effort; ignored if it fails).
async function autoCloseIfExpired(){
  if(!hasConfigTable || !sessionConfig) return;
  if(sessionConfig.attendance_active && sessionConfig.session_end_at &&
     new Date(sessionConfig.session_end_at).getTime() <= Date.now()){
    try{
      await supabaseClient.from('app_config').update({ attendance_active:false }).eq('id', 1);
    }catch(e){ /* ignore */ }
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function showBanner(tone, text){
  const el = $('dataBanner');
  el.className = 'banner show ' + tone;
  el.textContent = text;
}
function hideBanner(){ $('dataBanner').className = 'banner'; }

function fmtDateLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}

function fmtTimeLabel(iso){
  if(!iso) return null;
  return new Date(iso).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
}

function formatCountdown(ms){
  if(ms <= 0) return '00:00';
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const mm = String(m).padStart(2,'0');
  const ss = String(s).padStart(2,'0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

// ---- Live "Auto-ends in" countdown, mirrors the one on TGLCC_Admin.html ----
function startCountdownTicker(){
  if(countdownTicker){ clearInterval(countdownTicker); countdownTicker = null; }
  countdownTicker = setInterval(() => {
    const el = $('sessionCountdown');
    if(!el || !sessionConfig || !sessionConfig.session_end_at){
      clearInterval(countdownTicker); countdownTicker = null;
      return;
    }
    const ms = new Date(sessionConfig.session_end_at).getTime() - Date.now();
    if(ms <= 0){
      el.textContent = '00:00';
      clearInterval(countdownTicker); countdownTicker = null;
      refreshSessionState();
      return;
    }
    el.textContent = formatCountdown(ms);
  }, 1000);
}

// ---- Renders either the "not started yet" hero, or the live session
// info strip (Attendance Date / Started / Auto-ends countdown) ----
function renderSessionBar(open){
  const bar = $('sessionBar');
  if(!bar) return;

  if(!open){
    if(countdownTicker){ clearInterval(countdownTicker); countdownTicker = null; }
    bar.innerHTML = `
      <div class="hero-card">
        <span class="status-pill pending"><span class="status-dot"></span>Service hasn't started yet</span>
        <h2>We're getting ready!</h2>
        <p>Attendance for today's service is not open yet. Please wait while our admin prepares everything.</p>
        <div class="service-time">Service starts at 10:30 AM</div>
      </div>
    `;
    return;
  }

  const startedLabel = hasStartedAtColumn ? fmtTimeLabel(sessionConfig && sessionConfig.session_started_at) : null;
  const hasEnd = !!(sessionConfig && sessionConfig.session_end_at);
  const endMs = hasEnd ? (new Date(sessionConfig.session_end_at).getTime() - Date.now()) : null;

  bar.innerHTML = `
    <div class="session-bar">
      <span class="status-pill active"><span class="status-dot pulse"></span>Attendance is Open</span>
      <div class="session-stats">
        <div class="stat-item">
          <div class="stat-label">Attendance Date</div>
          <div class="stat-value">${fmtDateLabel(currentDate)}</div>
        </div>
        ${startedLabel ? `
        <div class="stat-item">
          <div class="stat-label">Started</div>
          <div class="stat-value">${startedLabel}</div>
        </div>` : ''}
        <div class="stat-item">
          <div class="stat-label">${hasEnd ? 'Auto-ends in' : 'Ends'}</div>
          <div class="stat-value countdown" id="sessionCountdown">${hasEnd ? formatCountdown(endMs) : 'Manually'}</div>
        </div>
      </div>
    </div>
  `;

  if(hasEnd) startCountdownTicker();
}

// ---- Load active members (id, member_no, name) straight from the same
// Supabase "members" table the Member Database app writes to.
async function loadMembers(){
  try{
    const { data, error } = await supabaseClient
      .from('members')
      .select('id,member_no,name,active')
      .eq('active', true)
      .order('name', { ascending: true });
    if(error) throw error;
    members = data || [];
    hideBanner();
  }catch(e){
    console.error('Failed to load members:', e);
    members = [];
    showBanner('error', 'Could not load members from Supabase. Check your internet connection.');
  }
}

// ---- Who has already checked in for currentDate, from the relational
// attendance_records table (one row per member per date, linked to
// members.id via a foreign key). ----
async function loadCheckedInForDate(){
  checkedInIds = new Set();
  try{
    const { data, error } = await supabaseClient
      .from('attendance_records')
      .select('member_id')
      .eq('attendance_date', currentDate);
    if(error) throw error;
    checkedInIds = new Set((data || []).map(r => r.member_id));
  }catch(e){
    console.error('Failed to load attendance for date:', e);
    showBanner('error', 'Could not load today\'s church-ins. The "attendance_records" table may not be set up yet.');
  }
}

async function onDateChange(){
  if(hasConfigTable) return; // date is admin-controlled once app_config is set up
  currentDate = $('attendanceDate').value || todayStr();
  $('dateLabel').textContent = "Welcome! We're glad you're here.";
  clearSelection();
  await loadCheckedInForDate();
  renderMatches();
}

// ---- Search / select / confirm flow ----
function renderMatches(){
  const q = ($('searchBox').value || '').trim().toLowerCase();
  $('resultsBox').style.display = 'none';
  $('emptyState').style.display = 'none';

  if(!q){ return; }

  const list = members
    .filter(m => !checkedInIds.has(m.id))
    .filter(m => {
      const name = (m.name||'').toLowerCase();
      const no = String(m.member_no||'');
      return name.includes(q) || no.includes(q);
    })
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''))
    .slice(0, 8);

  if(!list.length){
    $('emptyState').style.display = '';
    return;
  }

  const box = $('resultsBox');
  box.style.display = '';
  box.innerHTML = list.map(m => `
    <div class="member-row" onclick="selectMember('${m.id}')">
      <span class="m-no">${m.member_no ? '#' + m.member_no : ''}</span>
      <span class="m-name">${escapeHtml(m.name)}</span>
      <span class="m-go">SELECT →</span>
    </div>
  `).join('');
}

function selectMember(id){
  const m = members.find(x=>x.id===id);
  if(!m) return;
  selectedMember = m;
  $('searchBox').value = '';
  $('resultsBox').style.display = 'none';
  $('emptyState').style.display = 'none';
  $('checkinFlow').innerHTML = `
    <div class="confirm-card">
      <div class="c-label">Confirm your attendance</div>
      <div class="c-name">${escapeHtml(m.name)}</div>
      <div class="c-no">${m.member_no ? 'Member No. ' + m.member_no : ''} · ${fmtDateLabel(currentDate)}</div>
      <div class="confirm-actions">
        <button class="btn btn-ghost" onclick="clearSelection()">Not me / Cancel</button>
        <button class="btn btn-primary" id="confirmBtn" onclick="confirmCheckIn()">Yes, this is me</button>
      </div>
    </div>
  `;
}

function clearSelection(){
  selectedMember = null;
  $('checkinFlow').innerHTML = `
    <div class="search-wrap">
      <input class="search" id="searchBox" type="text" placeholder="Type your name or ID number to find yourself" oninput="renderMatches()" autocomplete="off">
    </div>
    <div class="search-hint">Everyone churches in individually — find your own name below, confirm, and you're done. Once you've churched in for the date above, your name won't show up again.</div>

    <div class="results-wrap" id="resultsBox" style="display:none;"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <h3>No matches</h3>
      <div>Double check the spelling, or your ID number, or you may have already churched in today.</div>
    </div>
  `;
}

async function confirmCheckIn(){
  if(!selectedMember) return;
  const m = selectedMember;
  const btn = $('confirmBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Churching in…'; }

  const row = {
    member_id: m.id,
    member_name: m.name,
    attendance_date: currentDate,
  };

  try{
    const { error } = await supabaseClient.from('attendance_records').insert([row]);
    if(error){
      // Unique violation = they (or someone else) already checked this
      // member in for this date — treat it as success rather than an error.
      if(error.code !== '23505') throw error;
    }
    checkedInIds.add(m.id);
    showSuccess(m);
  }catch(e){
    console.error('Failed to record attendance:', e);
    toast('⚠ Could not save — check your connection and that "attendance_records" table exists');
    if(btn){ btn.disabled = false; btn.textContent = 'Yes, this is me'; }
  }
}

function showSuccess(m){
  selectedMember = null;
  $('checkinFlow').innerHTML = `
    <div class="success-card">
      <div class="success-check">&#10003;</div>
      <h3>Thanks, ${escapeHtml(m.name)}!</h3>
      <p>Your attendance for ${fmtDateLabel(currentDate)} has been recorded.</p>
    </div>
  `;
  setTimeout(()=>{ if(!selectedMember) clearSelection(); }, 1800);
}

let sessionWasOpen = null; // tracks previous open/closed state to detect transitions

async function refreshSessionState(){
  const prevDate = currentDate;
  await loadSessionConfig();
  await autoCloseIfExpired();

  if(hasConfigTable && sessionConfig && sessionConfig.attendance_date){
    currentDate = sessionConfig.attendance_date;
  }
  $('attendanceDate').value = currentDate;
  $('dateLabel').textContent = "Welcome! We're glad you're here.";
  // Once an admin config exists, the date is admin-controlled (via the
  // Admin Panel), so lock the member-facing picker. With no app_config
  // table, the date picker stays fully manual, like the original app.
  $('attendanceDate').disabled = hasConfigTable;
  $('attendanceDate').title = hasConfigTable ? 'Attendance date is set by an admin' : 'Tap to change the date';
  if($('dateChevron')) $('dateChevron').style.display = hasConfigTable ? 'none' : '';

  const open = sessionIsOpen();
  const dateChanged = prevDate !== currentDate;

  renderSessionBar(open);

  if(!open){
    if(sessionWasOpen !== false) $('checkinFlow').innerHTML = '';
  }else if(sessionWasOpen === false || sessionWasOpen === null || dateChanged){
    // Just opened (or the admin changed the date) — rebuild the normal
    // search UI, exactly as the original app renders it on load.
    clearSelection();
  }

  sessionWasOpen = open;
  return open;
}

async function init(){
  $('todayLabel').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  $('attendanceDate').value = currentDate;
  $('dateLabel').textContent = "Welcome! We're glad you're here.";
  await loadMembers();

  const open = await refreshSessionState();
  if(open){
    await loadCheckedInForDate();
    renderMatches();
  }

  // Poll periodically so the page reflects admin actions (start/end
  // attendance, date change, auto-end) without needing a manual refresh.
  setInterval(async () => {
    const wasSelecting = !!selectedMember;
    if(wasSelecting) return; // don't yank the UI out from under someone mid-confirm
    const nowOpen = await refreshSessionState();
    if(nowOpen){
      await loadCheckedInForDate();
      renderMatches();
    }
  }, 20000);
}

init();

</script>

</body>
</html>
